name: demo_app
description: Ứng dụng quản lý tuần tra bảo vệ (Tactical Patrol Ops).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  audioplayers: ^6.8.1
  flutter:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_riverpod: ^2.4.9
  geolocator: ^14.1.2
  image_picker: ^1.2.4
  latlong2: ^0.10.1
  local_auth: ^3.0.2
  mobile_scanner: ^7.4.2
  path_provider: ^2.1.6
  permission_handler: ^13.0.2
  qr_flutter: ^4.1.0
  record: ^7.1.2
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
